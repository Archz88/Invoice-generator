<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Pabrik</title>
<meta name="theme-color" content="#131F38">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --dye:#1B2A4A; --dye-deep:#131F38; --dye-line:#2E4370;
  --paper:#EFEAE0; --paper-2:#E4DED1;
  --ink:#1A1D24; --ink-soft:#5C5F68;
  --thread:#D4A017; --retur:#A63D40; --ok:#2F6B4F; --muted:#8B99B4;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--dye); color:var(--paper);
  font-family:CarlitoUI,system-ui,sans-serif; font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
h1,h2,.display{font-family:CaladeaUI,Georgia,serif; font-weight:700; letter-spacing:-.01em}

/* ---------- kepala ---------- */
.top{
  background:var(--dye-deep); padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  border-bottom:1px solid var(--dye-line);
}
.eyebrow{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.top h1{margin:2px 0 0; font-size:26px; line-height:1}
.top .date{font-size:13px; color:var(--muted); text-align:right; padding-bottom:2px}

/* ---------- kartu ---------- */
main{padding:16px 14px 0; max-width:720px; margin:0 auto}
.card{
  background:var(--paper); color:var(--ink); border-radius:var(--r);
  padding:16px 16px 18px; margin-bottom:14px;
}
.card > h2{margin:0 0 14px; font-size:18px; display:flex; align-items:center; gap:10px}
.card > h2 .n{
  font-family:CarlitoUI,sans-serif; font-size:11px; font-weight:700; letter-spacing:.1em;
  color:var(--ink-soft); border:1px solid #C9C0AE; border-radius:99px; padding:2px 8px;
}
label{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-soft); margin:0 0 5px}
input[type=text],input[type=date],select,textarea{
  width:100%; font:inherit; color:var(--ink); background:#F7F4EE;
  border:1px solid #C9C0AE; border-radius:9px; padding:11px 12px; min-height:46px;
}
input:focus-visible,select:focus-visible,button:focus-visible{
  outline:3px solid var(--thread); outline-offset:2px;
}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.hint{font-size:12px; color:var(--ink-soft); margin-top:4px; min-height:16px}
.hint b{color:var(--ink); font-weight:700}

/* ---------- barang: kartu bertepi selvedge ---------- */
.item{
  position:relative; background:var(--paper-2); border-radius:10px;
  padding:14px 14px 14px 22px; margin-bottom:12px; overflow:hidden;
}
.item::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:9px;
  background:repeating-linear-gradient(180deg,var(--dye) 0 5px,transparent 5px 10px);
}
.item.retur::before{background:repeating-linear-gradient(180deg,var(--retur) 0 5px,transparent 5px 10px)}
.item-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.item-no{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
.rowtotal{
  margin-top:10px; padding-top:10px; border-top:1px dashed #BCB2A0;
  display:flex; justify-content:space-between; align-items:baseline; font-size:15px;
}
.rowtotal b{font-family:CaladeaUI,Georgia,serif; font-size:18px}
.item.retur .rowtotal b{color:var(--retur)}
.tot{display:flex; align-items:center; gap:8px}
.rowtotal input{width:158px; text-align:right; min-height:38px; padding:6px 9px; font-size:15px}
.btn-mini{
  background:transparent; border:1px solid #C4B9A6; color:var(--ink-soft);
  font-size:12px; min-height:34px; padding:0 10px; border-radius:8px;
}

/* ---------- tombol ---------- */
button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid transparent}
.btn-add{
  width:100%; min-height:48px; background:transparent; color:var(--ink);
  border:1.5px dashed #B6AB97; font-weight:700;
}
.btn-add:active{background:#E8E1D3}
.btn-del{
  background:transparent; border:1px solid #C4B9A6; color:var(--ink-soft);
  min-height:34px; padding:0 12px; font-size:13px;
}
.switch{display:flex; align-items:center; gap:10px; min-height:44px; cursor:pointer}
.switch input{width:22px; height:22px; accent-color:var(--dye)}
.switch span{font-size:14px}

/* ---------- bilah bawah ---------- */
.bar{
  position:fixed; left:0; right:0; bottom:0; background:var(--dye-deep);
  border-top:1px solid var(--dye-line); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px; z-index:5;
}
.bar .sum{flex:1; min-width:0}
.bar .sum .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.bar .sum .val{font-family:CaladeaUI,Georgia,serif; font-size:21px; line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.btn-main{
  background:var(--thread); color:#20180A; font-weight:700; min-height:52px;
  padding:0 22px; font-size:16px; white-space:nowrap;
}
.btn-main:disabled{opacity:.45}

/* ---------- lembar hasil ---------- */
.sheet{
  position:fixed; inset:0; background:rgba(10,16,30,.72); z-index:10;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet[hidden]{display:none}
.sheet-in{
  background:var(--paper); color:var(--ink); width:100%; max-width:520px;
  border-radius:18px 18px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  animation:up .22s ease-out; max-height:88vh; overflow:auto;
}
@keyframes up{from{transform:translateY(14px); opacity:0}}
.sheet-in h2{margin:0 0 6px; font-size:20px}
.filename{
  font-size:13px; color:var(--ink-soft); word-break:break-all; margin-bottom:6px;
  background:#F7F4EE; border:1px solid #D8CFBD; border-radius:8px; padding:9px 11px;
}
.sheet-in .btn-main{width:100%; margin-bottom:10px; display:block}
.btn-ghost{
  width:100%; min-height:48px; background:transparent; border:1px solid #C4B9A6;
  color:var(--ink); font-weight:700; display:block; margin-bottom:10px;
}
.err{color:var(--retur); font-size:14px; margin-top:8px}
.note{font-size:13px; color:var(--ink-soft); margin:-4px 0 14px}
.rec{border-top:1px solid #D8CFBD; padding:12px 0}
.rec:first-child{border-top:none; padding-top:0}
.rec-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.rec-name{font-size:14px; font-weight:700; word-break:break-word}
.badge{font-size:11px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
  border-radius:99px; padding:3px 9px; border:1px solid currentColor}
.badge.sent{color:var(--ok)} .badge.pending{color:#8A6A12} .badge.error{color:var(--retur)}
.rec-msg{font-size:12px; color:var(--ink-soft); margin-top:4px}
.rec-act{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
.empty{font-size:14px; color:var(--ink-soft)}
.sync-line{font-size:13px; margin:0 0 14px; min-height:20px}
.sync-line.ok{color:var(--ok)} .sync-line.warn{color:#8A6A12} .sync-line.bad{color:var(--retur)}
input[type=url]{width:100%; font:inherit; color:var(--ink); background:#F7F4EE;
  border:1px solid #C9C0AE; border-radius:9px; padding:11px 12px; min-height:46px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
@media (min-width:560px){ .top h1{font-size:30px} }
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="eyebrow">Pabrik &middot; Bandung</div>
    <h1>Invoice</h1>
  </div>
  <div class="date" id="topDate"></div>
</header>

<main>
  <section class="card">
    <h2><span class="n">1</span> Pelanggan</h2>
    <div class="field">
      <label for="cust">Tersimpan</label>
      <select id="cust"></select>
    </div>
    <div class="field">
      <label for="cname">Nama</label>
      <input type="text" id="cname" autocomplete="off">
    </div>
    <div class="field">
      <label for="caddr">Alamat</label>
      <input type="text" id="caddr" autocomplete="off">
    </div>
    <div class="field">
      <label for="cphone">Telepon</label>
      <input type="text" id="cphone" inputmode="tel" autocomplete="off">
    </div>
  </section>

  <section class="card">
    <h2><span class="n">2</span> Barang</h2>
    <div id="items"></div>
    <button class="btn-add" id="addItem" type="button">+ Tambah baris</button>
  </section>

  <section class="card">
    <h2><span class="n">3</span> Rincian</h2>
    <div class="field">
      <label for="invdate">Tanggal invoice</label>
      <input type="date" id="invdate">
      <div class="hint" id="invdateHint"></div>
    </div>
    <div class="grid2">
      <div class="field">
        <label for="city">Kota</label>
        <input type="text" id="city">
      </div>
      <div class="field">
        <label for="bank">Rekening</label>
        <input type="text" id="bank">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label for="signer">Penandatangan</label>
        <input type="text" id="signer">
      </div>
      <div class="field">
        <label for="signerShort">Nama di tanda tangan</label>
        <input type="text" id="signerShort">
      </div>
    </div>
    <label class="switch" style="margin-top:6px">
      <input type="checkbox" id="showTotal">
      <span>Tampilkan baris Total di bawah tabel</span>
    </label>
  </section>
  <section class="card">
    <h2><span class="n">4</span> Kiriman ke Drive</h2>
    <p class="note">Invoice selalu dibuat di HP, termasuk saat tidak ada sinyal.
      Kiriman ke Drive menyusul begitu ada internet.</p>
    <div class="field">
      <label for="gsUrl">Alamat Apps Script</label>
      <input type="url" id="gsUrl" inputmode="url" placeholder="https://script.google.com/macros/s/..." autocomplete="off">
    </div>
    <div class="field">
      <label for="gsToken">Kata sandi</label>
      <input type="text" id="gsToken" autocomplete="off">
    </div>
    <label class="switch">
      <input type="checkbox" id="gsAuto" checked>
      <span>Kirim otomatis setelah invoice dibuat</span>
    </label>
    <button class="btn-add" id="gsTest" type="button" style="margin-top:8px">Uji koneksi</button>
    <div class="hint" id="gsStatus"></div>
  </section>

  <section class="card">
    <h2><span class="n">5</span> Riwayat</h2>
    <div id="history"><p class="empty">Belum ada invoice.</p></div>
  </section>
</main>

<div class="bar">
  <div class="sum">
    <div class="lbl">Jumlah</div>
    <div class="val" id="grand">Rp 0,00</div>
  </div>
  <button class="btn-main" id="make" type="button">Buat PDF</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <h2>Invoice siap</h2>
    <div class="filename" id="outName"></div>
    <div class="sync-line" id="syncLine"></div>
    <button class="btn-main" id="share" type="button">Bagikan</button>
    <button class="btn-ghost" id="open" type="button">Buka PDF</button>
    <button class="btn-ghost" id="save" type="button">Simpan ke perangkat</button>
    <button class="btn-ghost" id="reset" type="button">Kosongkan untuk invoice berikutnya</button>
    <button class="btn-ghost" id="close" type="button" style="border:none">Tutup</button>
    <div class="err" id="err"></div>
  </div>
</div>

  var BASE_OFF = 15.875;                         // jarak tepi atas baris -> baseline teks
  var PAD = 4;                                   // LEFT/RIGHT padding sel
  var RP_W = 20;                                 // lebar kolom "Rp" di dalam sel uang
  var AMT_RPAD = 6;                              // indent kanan nominal (gaya akuntansi)

  function colLeft(i) { var x = LM; for (var k = 0; k < i; k++) x += COL[k]; return x; }

  // ================= Format angka gaya Indonesia ==============================
  function fmtAmount(n) {
    var neg = n < 0;
    var v = Math.abs(n);
    var s = v.toFixed(2);
    var p = s.split(".");
    var intPart = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + intPart + "," + p[1];
  }
  function fmtUnit(n) {
    var v = Math.round(Math.abs(n));
    var s = String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (n < 0 ? "-" : "") + s;
  }
  var BULAN = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni",
    "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  function todayId() {
    // Waktu Asia/Jakarta (WIB, UTC+7)
    var now = new Date();
    var wib = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + 7 * 3600000);
    return wib.getDate() + " " + BULAN[wib.getMonth() + 1] + " " + wib.getFullYear();
  }

  // ================= Encoding teks (WinAnsi / cp1252) =========================
  var CP1252_HIGH = {
    0x20AC: 128, 0x201A: 130, 0x0192: 131, 0x201E: 132, 0x2026: 133, 0x2020: 134,
    0x2021: 135, 0x02C6: 136, 0x2030: 137, 0x0160: 138, 0x2039: 139, 0x0152: 140,
    0x017D: 142, 0x2018: 145, 0x2019: 146, 0x201C: 147, 0x201D: 148, 0x2022: 149,
    0x2013: 150, 0x2014: 151, 0x02DC: 152, 0x2122: 153, 0x0161: 154, 0x203A: 155,
    0x0153: 156, 0x017E: 158, 0x0178: 159
  };
  function toCode(ch) {
    var c = ch.charCodeAt(0);
    if (c < 256) return c;
    if (CP1252_HIGH[c] !== undefined) return CP1252_HIGH[c];
    return 63; // '?'
  }
  function encodeStr(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) out += String.fromCharCode(toCode(s[i]));
    return out;
  }
  function pdfStr(s) {
    var e = encodeStr(s), out = "";
    for (var i = 0; i < e.length; i++) {
      var ch = e[i], c = e.charCodeAt(i);
      if (ch === "(" || ch === ")" || ch === "\\") out += "\\" + ch;
      else if (c < 32 || c > 126) out += "\\" + ("00" + c.toString(8)).slice(-3);
      else out += ch;
    }
    return "(" + out + ")";
  }

  // ================= Pengukuran lebar teks ====================================
  function strWidth(s, bold, size) {
    var W = bold ? ASSETS.widthsBold : ASSETS.widthsRegular;
    var tot = 0;
    for (var i = 0; i < s.length; i++) {
      var c = toCode(s[i]);
      if (c >= 32 && c <= 255) tot += W[c - 32];
    }
    return tot * size / 1000.0;
  }

  // ================= Penulis PDF minimal ======================================
  function b64ToBytes(b64) {
    if (typeof Buffer !== "undefined") return new Uint8Array(Buffer.from(b64, "base64"));
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function latin1ToBytes(s) {
    var a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xff;
    return a;
  }
  function concatBytes(list) {
    var n = 0, i;
    for (i = 0; i < list.length; i++) n += list[i].length;
    var out = new Uint8Array(n), o = 0;
    for (i = 0; i < list.length; i++) { out.set(list[i], o); o += list[i].length; }
    return out;
  }

  function fontObjs(objs, tag, b64, widths, desc, baseName) {
    var raw = b64ToBytes(b64);
    var fileNo = objs.length + 3;   // Font, Descriptor, FontFile2
    var fontNo = objs.length + 1, descNo = objs.length + 2;
    objs.push({ s: "<< /Type /Font /Subtype /TrueType /BaseFont /" + baseName +
      " /FirstChar 32 /LastChar 255 /Widths [" + widths.join(" ") +
      "] /Encoding /WinAnsiEncoding /FontDescriptor " + descNo + " 0 R >>" });
    objs.push({ s: "<< /Type /FontDescriptor /FontName /" + baseName +
      " /Flags " + desc.flags + " /FontBBox [" + desc.bbox.join(" ") + "] /ItalicAngle " +
      desc.italicAngle + " /Ascent " + desc.ascent + " /Descent " + desc.descent +
      " /CapHeight " + desc.capHeight + " /StemV " + desc.stemV +
      " /FontFile2 " + fileNo + " 0 R >>" });
    objs.push({ s: "<< /Length " + raw.length + " /Length1 " + raw.length + " >>", stream: raw });
    return fontNo;
  }

  function assemble(objs, rootNo) {
    var head = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";
    var chunks = [latin1ToBytes(head)];
    var pos = head.length, offsets = [];
    for (var i = 0; i < objs.length; i++) {
      offsets.push(pos);
      var o = objs[i];
      var s = (i + 1) + " 0 obj\n" + o.s + "\n";
      if (o.stream) {
        s += "stream\n";
        chunks.push(latin1ToBytes(s)); pos += s.length;
        chunks.push(o.stream); pos += o.stream.length;
        var t = "\nendstream\nendobj\n";
        chunks.push(latin1ToBytes(t)); pos += t.length;
      } else {
        s += "endobj\n";
        chunks.push(latin1ToBytes(s)); pos += s.length;
      }
    }
    var xref = "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
    for (var j = 0; j < offsets.length; j++) {
      xref += ("0000000000" + offsets[j]).slice(-10) + " 00000 n \n";
    }
    xref += "trailer\n<< /Size " + (objs.length + 1) + " /Root " + rootNo +
      " 0 R >>\nstartxref\n" + pos + "\n%%EOF\n";
    chunks.push(latin1ToBytes(xref));
    return concatBytes(chunks);
  }

  // ================= Generator invoice ========================================
  function invoiceFilename(data) {
    var d = data.invoice_date || todayId();
    return "Invoice " + data.customer_name + " " + d + ".pdf";
  }

  function buildInvoice(data) {
    var invDate = data.invoice_date || todayId();
    var items = data.items || [];
    var showTotal = !!data.show_total_row;
    var nRows = items.length + 1 + (showTotal ? 1 : 0);
    var th = ROW_H * nRows;
    var tableBottom = TABLE_TOP - th;

    var c = [];   // operator content stream
    function txt(x, y, s, bold, size) {
      c.push("BT 1 0 0 1 " + x.toFixed(4) + " " + y.toFixed(4) + " Tm /" +
        (bold ? "F2" : "F1") + " " + size + " Tf " + pdfStr(s) + " Tj ET");
    }
    function txtCenter(cx, y, s, bold, size) {
      txt(cx - strWidth(s, bold, size) / 2, y, s, bold, size);
    }
    function txtRight(rx, y, s, bold, size) {
      txt(rx - strWidth(s, bold, size), y, s, bold, size);
    }

    c.push("0 0 0 rg");

    // --- Judul ---
    txtCenter(PAGE_W / 2, PAGE_H - 52, "INVOICE", true, 28);

    // --- Info pelanggan ---
    var xC = colLeft(2);
    var info = [
      ["Customer Name", data.customer_name],
      ["Customer Address", data.customer_address],
      ["Customer Phone", data.customer_phone]
    ];
    var y = PAGE_H - 100;
    for (var i = 0; i < info.length; i++) {
      txt(LM, y, info[i][0], false, 14);
      txt(xC, y, ": " + (info[i][1] === undefined ? "" : info[i][1]), false, 14);
      y -= 22;
    }

    // --- Isi tabel ---
    function cellCenter(colIdx, rowTop, s, bold) {
      var avail = COL[colIdx] - 2 * PAD;
      txt(colLeft(colIdx) + PAD + (avail - strWidth(s, bold, 14)) / 2,
        rowTop - BASE_OFF, s, bold, 14);
    }
    function cellLeft(colIdx, rowTop, s, bold) {
      txt(colLeft(colIdx) + PAD, rowTop - BASE_OFF, s, bold, 14);
    }
    function cellMoney(colIdx, rowTop, amount) {
      var base = rowTop - BASE_OFF;
      txt(colLeft(colIdx) + PAD, base, "Rp", false, 14);
      txtRight(colLeft(colIdx) + COL[colIdx] - PAD - AMT_RPAD, base, fmtAmount(amount), false, 14);
    }

    var head = ["No", "Product", "Date", "Unit (Yard)", "Price", "Total"];
    var rowTop = TABLE_TOP;
    for (var h = 0; h < head.length; h++) cellCenter(h, rowTop, head[h], true);

    for (var r = 0; r < items.length; r++) {
      rowTop -= ROW_H;
      var it = items[r];
      var total = (it.total === undefined || it.total === null)
        ? it.unit * it.price : it.total;
      cellCenter(0, rowTop, String(r + 1), false);
      cellLeft(1, rowTop, it.product || "", false);
      cellCenter(2, rowTop, it.date || "", false);
      cellCenter(3, rowTop, fmtUnit(it.unit), false);
      cellMoney(4, rowTop, it.price);
      cellMoney(5, rowTop, total);
    }

    if (showTotal) {
      rowTop -= ROW_H;
      var grand = 0;
      for (var g = 0; g < items.length; g++) {
        var t = items[g].total;
        grand += (t === undefined || t === null) ? items[g].unit * items[g].price : t;
      }
      cellLeft(3, rowTop, "Total", true);
      cellMoney(5, rowTop, grand);
    }

    // --- Garis tabel (koordinat lokal tabel, seperti ReportLab) ---
    c.push("q 1 0 0 1 " + LM.toFixed(5) + " " + tableBottom.toFixed(4) + " cm");
    c.push("1 J 1 j 0 0 0 RG .75 w");
    function line(x1, y1, x2, y2) {
      c.push("n " + x1 + " " + y1 + " m " + x2 + " " + y2 + " l S");
    }
    line(0, th, TABLE_W, th);
    line(0, 0, TABLE_W, 0);
    line(0, 0, 0, th);
    line(TABLE_W, 0, TABLE_W, th);
    for (var k = 1; k < nRows; k++) line(0, k * ROW_H, TABLE_W, k * ROW_H);
    var xacc = 0;
    for (var v = 0; v < COL.length - 1; v++) {
      xacc += COL[v];
      // kolom 1|2 dan 2|3 berhenti di atas baris Total (efek SPAN)
      var yBot = (showTotal && v < 2) ? ROW_H : 0;
      line(xacc, yBot, xacc, th);
    }
    if (showTotal) {
      var spanRight = COL[0] + COL[1] + COL[2];
      c.push("1 1 1 RG");
      line(0, ROW_H, spanRight, ROW_H);
      line(0, 0, spanRight, 0);
      line(0, 0, 0, ROW_H);
    }
    c.push("Q");

    // --- Footer ---
    var footerY = TABLE_TOP - th - 55;
    txt(LM, footerY, "Payment Method :", true, 14);
    txt(LM, footerY - 22, data.bank || "BCA 8100126088", false, 14);
    txt(LM, footerY - 44, data.signer_name || "Michael Stefanus", false, 14);

    var xE = colLeft(4);
    var sigCenter = xE + (COL[4] + COL[5]) / 2.0;
    txtCenter(sigCenter, footerY, (data.city || "Bandung") + ", " + invDate, false, 14);

    // Ruang tanda tangan dibiarkan kosong (92 pt) untuk ditandatangani dengan pena.
    var sw = 92;
    txtCenter(sigCenter, footerY - 16 - sw - 2, data.signer_short || "Michael", false, 14);

    // --- Rakit objek PDF ---
    var objs = [];
    objs.push({ s: "<< /Type /Catalog /Pages 2 0 R >>" });                       // 1
    objs.push({ s: "<< /Type /Pages /Kids [3 0 R] /Count 1 >>" });               // 2
    objs.push({ s: "" });                                                        // 3 (page, diisi nanti)
    var content = latin1ToBytes(c.join("\n") + "\n");
    objs.push({ s: "<< /Length " + content.length + " >>", stream: content });   // 4

    var f1 = fontObjs(objs, "F1", ASSETS.fontRegular, ASSETS.widthsRegular,
      ASSETS.descRegular, "AAAAAA+Carlito");
    var f2 = fontObjs(objs, "F2", ASSETS.fontBold, ASSETS.widthsBold,
      ASSETS.descBold, "BAAAAA+Carlito-Bold");

    objs[2].s = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PAGE_W + " " + PAGE_H +
      "] /Contents 4 0 R /Resources << /Font << /F1 " + f1 + " 0 R /F2 " + f2 + " 0 R >> >> >>";

    return assemble(objs, 1);
  }

  var api = {
    buildInvoice: buildInvoice,
    invoiceFilename: invoiceFilename,
    fmtAmount: fmtAmount,
    fmtUnit: fmtUnit,
    todayId: todayId,
    strWidth: strWidth
  };
  if (typeof module !== "undefined" && module.exports) {
    global.ASSETS = require("./assets.js");
    module.exports = api;
  } else {
    global.InvoiceCore = api;
  }
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
<script>
(function(){
  "use strict";
  var C = window.InvoiceCore;

  // ---------- font antarmuka dari aset yang sama dengan PDF ----------
  var css = document.createElement("style");
  css.textContent =
    "@font-face{font-family:CarlitoUI;font-weight:400;font-display:swap;src:url(data:font/ttf;base64," + ASSETS.fontRegular + ") format('truetype')}" +
    "@font-face{font-family:CarlitoUI;font-weight:700;font-display:swap;src:url(data:font/ttf;base64," + ASSETS.fontBold + ") format('truetype')}" +
    "@font-face{font-family:CaladeaUI;font-weight:700;font-display:swap;src:url(data:font/ttf;base64," + ASSETS.fontDisplay + ") format('truetype')}";
  document.head.appendChild(css);

  // ---------- penyimpanan lokal (aman bila diblokir) ----------
  function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v); }catch(e){ return null; } }

  var BULAN = ["","Januari","Februari","Maret","April","Mei","Juni","Juli",
               "Agustus","September","Oktober","November","Desember"];
  function isoToId(iso){
    if(!iso) return "";
    var p = iso.split("-");
    return parseInt(p[2],10) + " " + BULAN[parseInt(p[1],10)] + " " + p[0];
  }
  function todayIso(){
    var n = new Date();
    var w = new Date(n.getTime() + n.getTimezoneOffset()*60000 + 7*3600000);
    return w.getFullYear() + "-" + ("0"+(w.getMonth()+1)).slice(-2) + "-" + ("0"+w.getDate()).slice(-2);
  }

  // ---------- angka gaya Indonesia ----------
  // "8.880" -> 8880 ; "6.968,75" -> 6968.75 ; "11.5" -> 11.5
  function parseID(s){
    if(typeof s === "number") return s;
    s = String(s).trim().replace(/\s/g,"").replace(/^Rp/i,"");
    if(!s) return 0;
    var neg = /^-/.test(s); s = s.replace(/^-/,"");
    if(s.indexOf(",") >= 0){
      s = s.replace(/\./g,"").replace(",",".");
    } else {
      s = s.replace(/\.(?=\d{3}(\D|$))/g,"");
    }
    var v = parseFloat(s);
    if(isNaN(v)) v = 0;
    return neg ? -v : v;
  }
  var money = C.fmtAmount, unitFmt = C.fmtUnit;

  var $ = function(id){ return document.getElementById(id); };

  // ---------- data pelanggan ----------
  var DEFAULT_CUSTOMERS = [
    {name:"Ismail", addr:"Jl. Pener, Cibeureum, RT 4 RW 27", phone:"085294384990"}
  ];
  var customers = DEFAULT_CUSTOMERS;
  try{ var raw = store("cust_list"); if(raw){ var p = JSON.parse(raw); if(p && p.length) customers = p; } }catch(e){}

  function renderCustomers(sel){
    var s = $("cust"); s.innerHTML = "";
    customers.forEach(function(c,i){
      var o = document.createElement("option"); o.value = String(i); o.textContent = c.name; s.appendChild(o);
    });
    var o2 = document.createElement("option"); o2.value = "new"; o2.textContent = "+ Pelanggan baru"; s.appendChild(o2);
    s.value = sel === undefined ? "0" : sel;
  }
  function applyCustomer(i){
    var c = customers[i]; if(!c) return;
    $("cname").value = c.name; $("caddr").value = c.addr; $("cphone").value = c.phone;
  }
  $("cust").addEventListener("change", function(){
    if(this.value === "new"){ $("cname").value=""; $("caddr").value=""; $("cphone").value=""; $("cname").focus(); }
    else applyCustomer(parseInt(this.value,10));
    saveDraft();
  });

  // ---------- baris barang ----------
  var items = [];
  function newItem(){ return {product:"", date:todayIso(), unit:"", price:"", retur:false, total:null}; }

  function itemNode(it, idx){
    var el = document.createElement("div");
    el.className = "item" + (it.retur ? " retur" : "");
    el.innerHTML =
      '<div class="item-head"><span class="item-no">Baris ' + (idx+1) + '</span>' +
      '<button class="btn-del" type="button" data-act="del">Hapus</button></div>' +
      '<div class="field"><label>Produk</label><input type="text" data-f="product" autocomplete="off"></div>' +
      '<div class="field"><label>Tanggal kirim</label><input type="date" data-f="date">' +
      '<div class="hint" data-h="date"></div></div>' +
      '<div class="grid2">' +
      '<div class="field"><label>Unit (yard)</label><input type="text" inputmode="decimal" data-f="unit">' +
      '<div class="hint" data-h="unit"></div></div>' +
      '<div class="field"><label>Harga / yard</label><input type="text" inputmode="decimal" data-f="price">' +
      '<div class="hint" data-h="price"></div></div></div>' +
      '<label class="switch"><input type="checkbox" data-f="retur"><span>Baris retur (nilai minus)</span></label>' +
      '<div class="rowtotal"><span>Total baris</span><span class="tot">' +
      '<b data-h="total">Rp 0,00</b>' +
      '<input type="text" inputmode="decimal" data-f="total" hidden>' +
      '<button class="btn-mini" type="button" data-act="edit">ubah</button></span></div>';

    el.querySelector('[data-f=product]').value = it.product;
    el.querySelector('[data-f=date]').value = it.date;
    el.querySelector('[data-f=unit]').value = it.unit;
    el.querySelector('[data-f=price]').value = it.price;
    el.querySelector('[data-f=retur]').checked = it.retur;
    if(it.total !== null && it.total !== undefined && it.total !== "")
      el.querySelector('[data-f=total]').value = it.total;

    el.addEventListener("input", function(ev){
      var f = ev.target.getAttribute("data-f"); if(!f) return;
      it[f] = ev.target.type === "checkbox" ? ev.target.checked : ev.target.value;
      el.classList.toggle("retur", !!it.retur);
      refreshItem(el, it); recalc(); saveDraft();
    });
    el.addEventListener("change", function(ev){
      if(ev.target.getAttribute("data-f") === "retur"){
        el.classList.toggle("retur", ev.target.checked);
        it.retur = ev.target.checked; refreshItem(el, it); recalc(); saveDraft();
      }
    });
    el.querySelector('[data-act=edit]').addEventListener("click", function(){
      if(it.total === null || it.total === undefined || it.total === ""){
        it.total = money(Math.abs(computed(it)));            // mulai dari hasil hitungan
        el.querySelector('[data-f=total]').value = it.total;
      } else {
        it.total = null;                                     // kembali ke otomatis
      }
      refreshItem(el, it); recalc(); saveDraft();
      if(it.total !== null) el.querySelector('[data-f=total]').focus();
    });
    el.querySelector('[data-act=del]').addEventListener("click", function(){
      items.splice(items.indexOf(it),1);
      if(!items.length) items.push(newItem());
      renderItems(); recalc(); saveDraft();
    });
    refreshItem(el, it);
    return el;
  }

  function computed(it){ return parseID(it.unit) * parseID(it.price); }
  function isManual(it){ return it.total !== null && it.total !== undefined && it.total !== ""; }
  function lineTotal(it){
    var t = isManual(it) ? parseID(it.total) : computed(it);
    return it.retur ? -Math.abs(t) : t;
  }
  function refreshItem(el, it){
    el.querySelector('[data-h=date]').innerHTML = it.date ? "<b>" + isoToId(it.date) + "</b>" : "";
    var u = parseID(it.unit), p = parseID(it.price);
    el.querySelector('[data-h=unit]').innerHTML = u ? "<b>" + unitFmt(u) + "</b> yard" : "";
    el.querySelector('[data-h=price]').innerHTML = p ? "Rp <b>" + money(p) + "</b>" : "";
    var man = isManual(it);
    var bEl = el.querySelector('[data-h=total]'), iEl = el.querySelector('[data-f=total]');
    bEl.hidden = man; iEl.hidden = !man;
    el.querySelector('[data-act=edit]').textContent = man ? "otomatis" : "ubah";
    bEl.textContent = "Rp " + money(lineTotal(it));
  }
  function renderItems(){
    var box = $("items"); box.innerHTML = "";
    items.forEach(function(it,i){ box.appendChild(itemNode(it,i)); });
  }
  $("addItem").addEventListener("click", function(){
    var last = items[items.length-1] || {};
    var it = newItem();
    it.product = last.product || "";        // biasanya produk sama, tinggal ubah tanggal
    it.price = last.price || "";
    items.push(it); renderItems(); recalc(); saveDraft();
    var nodes = $("items").children;
    nodes[nodes.length-1].querySelector('[data-f=date]').focus();
  });

  function recalc(){
    var g = 0;
    items.forEach(function(it){ g += lineTotal(it); });
    $("grand").textContent = "Rp " + money(g);
    $("make").disabled = !items.some(function(it){ return it.product && parseID(it.unit); });
  }

  // ---------- rincian ----------
  function onDate(){ $("invdateHint").innerHTML = "<b>" + isoToId($("invdate").value) + "</b>"; }
  $("invdate").addEventListener("input", function(){ onDate(); saveDraft(); });
  ["cname","caddr","cphone","city","bank","signer","signerShort"].forEach(function(id){
    $(id).addEventListener("input", saveDraft);
  });
  $("showTotal").addEventListener("change", saveDraft);

  // ---------- simpan / muat draf ----------
  function currentState(){
    return {
      cust:{name:$("cname").value, addr:$("caddr").value, phone:$("cphone").value},
      city:$("city").value, bank:$("bank").value,
      signer:$("signer").value, signerShort:$("signerShort").value,
      invdate:$("invdate").value, showTotal:$("showTotal").checked, items:items
    };
  }
  function saveDraft(){ try{ store("draft", JSON.stringify(currentState())); }catch(e){} }

  function init(){
    var d = null;
    try{ var r = store("draft"); if(r) d = JSON.parse(r); }catch(e){}
    var c = (d && d.cust) || customers[0];
    $("cname").value = c.name || ""; $("caddr").value = c.addr || ""; $("cphone").value = c.phone || "";
    $("city").value = (d && d.city) || "Bandung";
    $("bank").value = (d && d.bank) || "BCA 8100126088";
    $("signer").value = (d && d.signer) || "Michael Stefanus";
    $("signerShort").value = (d && d.signerShort) || "Michael";
    $("invdate").value = todayIso();
    $("showTotal").checked = d ? !!d.showTotal : false;
    items = (d && d.items && d.items.length) ? d.items : [newItem()];
    renderCustomers();
    var idx = customers.findIndex(function(x){ return x.name === $("cname").value; });
    $("cust").value = idx >= 0 ? String(idx) : "new";
    $("topDate").innerHTML = isoToId(todayIso());
    onDate(); renderItems(); recalc();
    loadSettings();
    renderHistory().then(flush);
  }

  // ================= antrean lokal (IndexedDB) =============================
  var DB = null;
  function idb(){
    return new Promise(function(res, rej){
      if(DB) return res(DB);
      var r = indexedDB.open("invoice-pabrik", 1);
      r.onupgradeneeded = function(){
        var d = r.result;
        if(!d.objectStoreNames.contains("queue")) d.createObjectStore("queue", {keyPath:"id"});
      };
      r.onsuccess = function(){ DB = r.result; res(DB); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function idbPut(rec){
    return idb().then(function(d){ return new Promise(function(res, rej){
      var t = d.transaction("queue","readwrite");
      t.objectStore("queue").put(rec);
      t.oncomplete = function(){ res(rec); };
      t.onerror = function(){ rej(t.error); };
    });});
  }
  function idbAll(){
    return idb().then(function(d){ return new Promise(function(res, rej){
      var t = d.transaction("queue","readonly");
      var q = t.objectStore("queue").getAll();
      q.onsuccess = function(){
        res((q.result||[]).sort(function(a,b){ return b.createdAt - a.createdAt; }));
      };
      q.onerror = function(){ rej(q.error); };
    });});
  }
  function idbDel(id){
    return idb().then(function(d){ return new Promise(function(res, rej){
      var t = d.transaction("queue","readwrite");
      t.objectStore("queue").delete(id);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error); };
    });});
  }

  // ================= pengaturan kiriman ====================================
  var S = { url:"", token:"", auto:true };
  function loadSettings(){
    try{
      var r = store("sync");
      if(r){ var p = JSON.parse(r); S.url = p.url||""; S.token = p.token||""; S.auto = p.auto !== false; }
    }catch(e){}
    $("gsUrl").value = S.url; $("gsToken").value = S.token; $("gsAuto").checked = S.auto;
  }
  function saveSettings(){
    S.url = $("gsUrl").value.trim(); S.token = $("gsToken").value.trim(); S.auto = $("gsAuto").checked;
    store("sync", JSON.stringify(S));
  }
  ["gsUrl","gsToken"].forEach(function(id){ $(id).addEventListener("input", saveSettings); });
  $("gsAuto").addEventListener("change", saveSettings);

  // Jalur 1: kirim biasa dan baca jawabannya.
  function postCors(payload){
    return fetch(S.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    }).then(function(r){ return r.json(); });
  }

  // Jalur 2: kirim tanpa membaca jawaban. Dipakai kalau browser menolak jalur 1.
  function postBlind(payload){
    return fetch(S.url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(){ return true; });
  }

  // Bertanya lewat <script>, cara yang tidak terhalang aturan lintas-situs.
  function jsonp(params, timeoutMs){
    return new Promise(function(res, rej){
      if(!S.url) return rej(new Error("alamat Apps Script belum diisi"));
      var cb = "cb_" + Date.now() + "_" + Math.floor(Math.random()*1000000);
      var q = ["callback=" + cb];
      Object.keys(params).forEach(function(k){
        q.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
      });
      var sc = document.createElement("script");
      var done = false;
      function cleanup(){
        clearTimeout(timer);
        try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
        if(sc.parentNode) sc.parentNode.removeChild(sc);
      }
      var timer = setTimeout(function(){
        if(done) return; done = true; cleanup(); rej(new Error("tidak ada jawaban"));
      }, timeoutMs || 20000);
      window[cb] = function(out){ if(done) return; done = true; cleanup(); res(out); };
      sc.onerror = function(){
        if(done) return; done = true; cleanup(); rej(new Error("alamat tidak bisa dihubungi"));
      };
      sc.src = S.url + (S.url.indexOf("?") >= 0 ? "&" : "?") + q.join("&");
      document.head.appendChild(sc);
    });
  }

  // Setelah jalur 2, pastikan invoice benar-benar tercatat.
  function confirmSent(id){
    function attempt(n){
      return new Promise(function(r){ setTimeout(r, n === 0 ? 1500 : 2500); })
        .then(function(){ return jsonp({action:"status", token:S.token, id:id}); })
        .then(function(out){
          if(out && out.ok && out.found) return true;
          if(out && !out.ok) throw new Error(out.error || "ditolak server");
          if(n + 1 >= 4) throw new Error("terkirim tapi belum tercatat");
          return attempt(n + 1);
        });
    }
    return attempt(0);
  }

  // Coba jalur 1 dulu; kalau browser menolaknya, pindah ke jalur 2.
  function deliver(payload){
    return postCors(payload).then(function(out){
      if(!out || !out.ok) return Promise.reject({server:true, msg:(out && out.error) || "ditolak server"});
      return out;
    }, function(){
      return postBlind(payload)
        .then(function(){ return confirmSent(payload.id); })
        .then(function(){ return { ok:true, fallback:true }; });
    }).catch(function(e){
      if(e && e.server) throw new Error(e.msg);
      throw (e instanceof Error) ? e : new Error(String((e && e.msg) || e));
    });
  }

  $("gsTest").addEventListener("click", function(){
    saveSettings();
    var st = $("gsStatus");
    if(!S.url){ st.innerHTML = "<b>Alamat Apps Script masih kosong.</b>"; return; }
    st.textContent = "Menghubungi...";
    jsonp({action:"ping", token:S.token}).then(function(out){
      if(out && out.ok){
        st.innerHTML = "<b>Tersambung.</b> Folder: " + out.folder +
          " &middot; Sheet: " + out.sheet + " (" + out.tab + ", " + out.baris + " baris)";
      } else {
        st.innerHTML = "<b>Ditolak:</b> " + ((out && out.error) || "jawaban tidak dikenali");
      }
    }).catch(function(e){
      st.innerHTML = "<b>Gagal:</b> " + e.message +
        ". Periksa alamatnya, dan pastikan Deploy diatur <b>Anyone</b>.";
    });
  });

  // ================= pengiriman & riwayat ==================================
  function blobToB64(blob){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onload = function(){ res(String(fr.result).split(",")[1]); };
      fr.onerror = function(){ rej(fr.error); };
      fr.readAsDataURL(blob);
    });
  }
  function sendOne(rec){
    if(!S.url) return Promise.reject(new Error("alamat Apps Script belum diisi"));
    return blobToB64(rec.pdf).then(function(b64){
      var payload = JSON.parse(JSON.stringify(rec.payload));
      payload.action = "invoice"; payload.token = S.token; payload.pdfBase64 = b64;
      return deliver(payload);
    }).then(function(out){
      rec.status = "sent"; rec.sentAt = Date.now();
      rec.fileUrl = out.fileUrl || rec.fileUrl || "";
      rec.error = ""; rec.duplicate = !!out.duplicate; rec.fallback = !!out.fallback;
      return idbPut(rec).then(function(){ return rec; });
    }).catch(function(e){
      rec.status = "error"; rec.error = e.message || String(e);
      return idbPut(rec).then(function(){ throw e; });
    });
  }

  var flushing = false;
  function flush(){
    if(flushing || !S.url || !navigator.onLine) return Promise.resolve();
    flushing = true;
    return idbAll().then(function(all){
      var todo = all.filter(function(r){ return r.status !== "sent" && r.pdf; });
      return todo.reduce(function(chain, rec){
        return chain.then(function(){ return sendOne(rec).catch(function(){}); });
      }, Promise.resolve());
    }).then(function(){ flushing = false; return renderHistory(); })
      .catch(function(){ flushing = false; });
  }
  window.addEventListener("online", function(){ flush(); });

  function shareBlob(blob, name){
    var file = new File([blob], name, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      return navigator.share({files:[file], title:name}).catch(function(e){
        if(e && e.name !== "AbortError") alert("Bagikan gagal: " + e.message);
      });
    }
    alert("Perangkat ini belum mendukung Bagikan. Pakai Simpan, lalu kirim dari aplikasi Files.");
    return Promise.resolve();
  }
  function openBlob(blob){
    var url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }
  function badge(rec){
    if(rec.status === "sent") return '<span class="badge sent">Terkirim</span>';
    if(rec.status === "error") return '<span class="badge error">Gagal</span>';
    return '<span class="badge pending">Menunggu</span>';
  }
  function renderHistory(){
    return idbAll().then(function(all){
      var box = $("history");
      if(!all.length){ box.innerHTML = '<p class="empty">Belum ada invoice.</p>'; return; }
      box.innerHTML = "";
      all.slice(0, 30).forEach(function(rec){
        var el = document.createElement("div");
        el.className = "rec";
        var msg = rec.status === "sent"
          ? (rec.duplicate ? "Sudah tercatat sebelumnya."
             : (rec.fallback ? "Tersimpan di Drive dan tercatat di Sheets (jalur cadangan)."
                             : "Tersimpan di Drive dan tercatat di Sheets."))
          : (rec.error ? rec.error : (navigator.onLine ? "Belum terkirim." : "Menunggu internet."));
        el.innerHTML =
          '<div class="rec-top"><span class="rec-name"></span>' + badge(rec) + '</div>' +
          '<div class="rec-msg"></div><div class="rec-act"></div>';
        el.querySelector(".rec-name").textContent = rec.filename;
        el.querySelector(".rec-msg").textContent = msg;
        var act = el.querySelector(".rec-act");
        function btn(text, fn){
          var b = document.createElement("button");
          b.className = "btn-mini"; b.type = "button"; b.textContent = text;
          b.addEventListener("click", fn); act.appendChild(b);
        }
        if(rec.pdf){
          btn("Bagikan", function(){ shareBlob(rec.pdf, rec.filename); });
          btn("Buka", function(){ openBlob(rec.pdf); });
          if(rec.status !== "sent"){
            btn("Kirim sekarang", function(){
              sendOne(rec).then(renderHistory).catch(function(){ renderHistory(); });
            });
          }
        }
        if(rec.fileUrl) btn("Lihat di Drive", function(){ window.open(rec.fileUrl, "_blank"); });
        btn("Hapus", function(){ idbDel(rec.id).then(renderHistory); });
        box.appendChild(el);
      });
      all.slice(20).forEach(function(rec){
        if(rec.status === "sent" && rec.pdf){ rec.pdf = null; idbPut(rec); }
      });
    });
  }

  // ================= membuat invoice =======================================
  function collect(){
    var iso = $("invdate").value;
    var list = [], rows = [];
    items.forEach(function(it){
      if(!it.product && !parseID(it.unit)) return;
      var t = lineTotal(it);
      list.push({ product: it.product, date: isoToId(it.date),
        unit: parseID(it.unit), price: parseID(it.price), total: t });
      rows.push({ product: it.product, date_iso: it.date, unit: parseID(it.unit),
        price: parseID(it.price), total: t, retur: !!it.retur });
    });
    return {
      pdf: {
        customer_name: $("cname").value, customer_address: $("caddr").value,
        customer_phone: $("cphone").value, city: $("city").value,
        invoice_date: isoToId(iso) || C.todayId(), bank: $("bank").value,
        signer_name: $("signer").value, signer_short: $("signerShort").value,
        show_total_row: $("showTotal").checked, items: list
      },
      rows: rows, iso: iso
    };
  }
  function newId(){
    var d = new Date(), z = function(n){ return ("0"+n).slice(-2); };
    return "INV-" + d.getFullYear() + z(d.getMonth()+1) + z(d.getDate()) + "-" +
      z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + "-" +
      Math.random().toString(36).slice(2,6).toUpperCase();
  }
  function rememberCustomer(d){
    var i = customers.findIndex(function(c){ return c.name === d.customer_name; });
    var rec = {name:d.customer_name, addr:d.customer_address, phone:d.customer_phone};
    if(i >= 0) customers[i] = rec; else customers.push(rec);
    try{ store("cust_list", JSON.stringify(customers)); }catch(e){}
    renderCustomers(String(customers.findIndex(function(c){ return c.name === rec.name; })));
  }
  function setSync(cls, text){
    var el = $("syncLine"); el.className = "sync-line " + cls; el.textContent = text;
  }

  var current = null;
  $("make").addEventListener("click", function(){
    $("err").textContent = "";
    try{
      var c = collect();
      var blob = new Blob([C.buildInvoice(c.pdf)], {type:"application/pdf"});
      var name = C.invoiceFilename(c.pdf);
      var id = newId();
      current = {
        id: id, filename: name, pdf: blob, status: "pending",
        createdAt: Date.now(), sentAt: 0, fileUrl: "", error: "", duplicate: false,
        payload: {
          id: id, filename: name, customer_name: c.pdf.customer_name,
          invoice_date: c.pdf.invoice_date, invoice_date_iso: c.iso, rows: c.rows
        }
      };
      $("outName").textContent = name;
      $("sheet").hidden = false;
      rememberCustomer(c.pdf);
    }catch(e){
      $("sheet").hidden = false;
      $("outName").textContent = "-";
      setSync("bad", "");
      $("err").textContent = "PDF gagal dibuat: " + e.message;
      return;
    }

    idbPut(current).then(renderHistory);

    if(!S.url){
      setSync("warn", "Tersimpan di HP. Isi bagian Kiriman ke Drive agar ikut tercatat.");
    } else if(!S.auto){
      setSync("warn", "Tersimpan di HP. Kirim lewat daftar Riwayat kalau sudah siap.");
    } else if(!navigator.onLine){
      setSync("warn", "Tersimpan di HP. Terkirim sendiri begitu ada internet.");
    } else {
      setSync("warn", "Mengirim ke Drive...");
      sendOne(current).then(function(rec){
        setSync("ok", rec.duplicate ? "Sudah tercatat sebelumnya."
          : "Tersimpan di Drive dan tercatat di Sheets.");
        renderHistory();
      }).catch(function(e){
        setSync("bad", "Belum terkirim: " + e.message +
          ". Tersimpan di HP dan bisa dikirim ulang dari Riwayat.");
        renderHistory();
      });
    }
  });

  $("reset").addEventListener("click", function(){
    items = [newItem()];
    renderItems(); recalc(); saveDraft();
    $("sheet").hidden = true;
    window.scrollTo({top:0, behavior:"smooth"});
  });
  $("close").addEventListener("click", function(){ $("sheet").hidden = true; });
  $("sheet").addEventListener("click", function(e){ if(e.target === this) this.hidden = true; });
  $("share").addEventListener("click", function(){ if(current) shareBlob(current.pdf, current.filename); });
  $("open").addEventListener("click", function(){ if(current) openBlob(current.pdf); });
  $("save").addEventListener("click", function(){
    if(!current) return;
    var url = URL.createObjectURL(current.pdf);
    var a = document.createElement("a"); a.href = url; a.download = current.filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  });

  init();

  if("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
